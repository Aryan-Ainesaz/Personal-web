<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aryan Ainesaz | Portfolio</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #f9fafb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 760px;
        padding: 2rem;
        border-radius: 20px;
        background: rgba(255,255,255,0.08);
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        backdrop-filter: blur(10px);
      }
      h1 { margin-top: 0; font-size: 2rem; }
      p { line-height: 1.7; }
      a { color: #93c5fd; }
      .chips span {
        display: inline-block;
        margin: 0.25rem 0.4rem 0.25rem 0;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Aryan Ainesaz</h1>
      <p>I’m a student and developer building practical projects in data, simulation, and software.</p>
      <div class="chips">
        <span>Python</span>
        <span>Data Projects</span>
        <span>Simulation</span>
        <span>Web Portfolio</span>
      </div>
      <p>This page is now published as a simple static GitHub Pages site.</p>
      <p><a href="https://github.com/Aryan-Ainesaz">GitHub</a></p>
    </main>
  </body>
</html>
